<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متن به PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,sans-serif}
body{background:#e8eaef;color:#1f2937;font-size:15px;line-height:1.7;padding-bottom:80px}
header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #6366f133}
header h1{font-size:17px;display:flex;gap:6px;align-items:center}
header button{background:#fff3;border:0;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;max-width:1400px;margin:0 auto;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.preview-col{position:fixed!important;inset:0;background:#0009;backdrop-filter:blur(6px);z-index:200;padding:16px;display:none;overflow-y:auto}.preview-col.on{display:block}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px #0000000d;border:1px solid #eef0f5;margin-bottom:14px}
.title{font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #eef2ff;display:flex;justify-content:space-between;align-items:center}
.ctrl{margin-bottom:16px}.ctrl:last-child{margin-bottom:0}
.lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.val{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;padding:2px 10px;border-radius:14px;font-size:12px;font-weight:700;min-width:42px;text-align:center}
input[type=range]{width:100%;height:36px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#e5e7eb}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);margin-top:-9px;border:3px solid #fff;box-shadow:0 2px 6px #6366f166}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:60px;padding:10px 6px;border-radius:10px;border:2px solid #e5e7eb;background:#fff;color:#6b7280;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.chip.active{background:#eef2ff;border-color:#6366f1;color:#4f46e5}
textarea{width:100%;min-height:260px;padding:14px;border-radius:12px;border:2px solid #e5e7eb;background:#fafbfc;font-family:inherit;font-size:15px;line-height:1.9;resize:vertical;transition:.2s}
textarea:focus{outline:0;border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px #6366f11a}
.info{display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-top:6px;padding:0 4px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 4px 12px #6366f144}
.btn-s{background:#f3f4f6;color:#4b5563;border:2px solid #e5e7eb;margin-top:8px}

/* ====== پیش‌نمایش واقعی A4 ====== */
.preview-col{position:sticky;top:80px}
.preview-toolbar{background:#2d3748;color:#fff;padding:10px 14px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.preview-toolbar .zoom-info{display:flex;align-items:center;gap:8px}
.preview-toolbar button{background:#ffffff1a;border:0;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px}
.preview-stage{background:#4a5568;padding:20px;border-radius:0 0 12px 12px;max-height:calc(100vh - 160px);overflow:auto;display:flex;justify-content:center}

/* کاغذ A4 واقعی — نسبت ۲۱۰×۲۹۷ */
.paper{
  background:#fff;
  width:210mm;
  min-height:297mm;
  box-shadow:0 8px 30px #0000004d;
  transform-origin:top center;
  transition:transform .2s;
  position:relative;
}
.paper-inner{
  padding:30px;
  color:#000;
  white-space:pre-wrap;
  word-wrap:break-word;
  direction:rtl;
  text-align:right;
  font-size:14px;
  line-height:1.8;
}

/* کادر متن خالی */
.paper-inner:empty::before{content:'متن شما اینجا نمایش داده می‌شود...';color:#cbd5e1;font-style:italic}

/* روی موبایل */
@media(max-width:900px){
  .preview-stage{max-height:none;padding:10px}
  .paper{transform:scale(.4)}
  .preview-toolbar{position:sticky;top:0;border-radius:0}
  .preview-close{display:flex!important}
}
.preview-close{display:none;background:#e53e3e!important;width:auto!important;padding:0 10px!important;font-size:12px!important;font-weight:600!important}

/* دکمه شناور پیش‌نمایش موبایل */
.float-preview{position:fixed;bottom:90px;left:20px;z-index:99;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:0;width:56px;height:56px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 4px 16px #6366f166;display:none}
@media(max-width:900px){.float-preview{display:flex;align-items:center;justify-content:center}}

.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:100;box-shadow:0 -2px 10px #0000000d}
.tab{flex:1;background:0;border:0;padding:8px 4px;font-family:inherit;font-size:11px;font-weight:600;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px}
.tab i{font-size:20px;font-style:normal}
.tab.active{color:#6366f1;background:#eef2ff}
.panel{display:none;animation:fade .25s}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.load{position:fixed;inset:0;background:#00000080;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999}
.load.on{display:flex}
.load .box{background:#fff;padding:24px 28px;border-radius:16px;text-align:center}
.spin{width:42px;height:42px;border:4px solid #eef2ff;border-top-color:#6366f1;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,100px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:.3s;max-width:calc(100% - 30px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#pdf{position:absolute;left:-9999px;top:0;background:#fff;color:#000}
</style>
</head>
<body>

<header>
  <h1>📄 متن به PDF</h1>
  <button onclick="alert('متن را وارد کنید، تنظیمات را اعمال کنید و PDF بگیرید.\n\nفایل در Downloads ذخیره می‌شود.')">?</button>
</header>

<div class="wrap">

  <!-- محتوای اصلی -->
  <main>
    <div class="panel active" id="p-text">
      <div class="card">
        <div class="title">✍️ متن شما</div>
        <textarea id="txt" placeholder="متن خود را بنویسید یا پیست کنید...">سلام، این یک متن نمونه است.
این برنامه متن شما را با تنظیمات دلخواه به PDF تبدیل می‌کند.

روی تب تنظیمات بزنید و موارد را اعمال کنید، سپس PDF بگیرید.</textarea>
        <div class="info"><span id="cc">۰ کاراکتر</span><span id="wc">۰ کلمه</span></div>
      </div>
      <button class="btn btn-p" onclick="tab('set')">مرحله بعد: تنظیمات ←</button>
    </div>

    <div class="panel" id="p-set">
      <div class="card">
        <div class="title">🔤 فونت و متن</div>
        <div class="ctrl">
          <div class="lbl"><span>سایز فونت</span><span class="val" id="fsV">۱۴</span></div>
          <input type="range" id="fs" min="8" max="40" value="14">
        </div>
        <div class="ctrl">
          <div class="lbl"><span>فاصله خطوط</span><span class="val" id="lhV">۱.۸</span></div>
          <input type="range" id="lh" min="1" max="3" step="0.1" value="1.8">
        </div>
        <div class="ctrl">
          <div class="lbl"><span>حاشیه صفحه</span><span class="val" id="pdV">۳۰</span></div>
          <input type="range" id="pd" min="10" max="100" value="30">
        </div>
      </div>

      <div class="card">
        <div class="title">🔤 نوع فونت</div>
        <div class="chips" id="ffG">
          <button class="chip active" data-v="Vazirmatn">وزیرمتن</button>
          <button class="chip" data-v="Tahoma">Tahoma</button>
          <button class="chip" data-v="Arial">Arial</button>
          <button class="chip" data-v="'Courier New'">Courier</button>
        </div>
      </div>

      <div class="card">
        <div class="title">↔️ جهت متن</div>
        <div class="chips" id="dirG">
          <button class="chip active" data-v="rtl">راست به چپ</button>
          <button class="chip" data-v="ltr">چپ به راست</button>
        </div>
      </div>

      <div class="card">
        <div class="title">📐 تراز متن</div>
        <div class="chips" id="alG">
          <button class="chip active" data-v="right">راست</button>
          <button class="chip" data-v="justify">هم‌تراز</button>
          <button class="chip" data-v="center">وسط</button>
        </div>
      </div>

      <div class="card">
        <div class="title">📄 اندازه صفحه</div>
        <div class="chips" id="psG">
          <button class="chip active" data-v="a4">A4</button>
          <button class="chip" data-v="a5">A5</button>
          <button class="chip" data-v="letter">Letter</button>
        </div>
      </div>

      <button class="btn btn-p" onclick="tab('exp')">مرحله بعد: خروجی ←</button>
    </div>

    <div class="panel" id="p-exp">
      <div class="card">
        <div class="title">💾 خروجی PDF</div>
        <div class="ctrl">
          <div class="lbl"><span>نام فایل</span></div>
          <input type="text" id="fn" value="document" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e5e7eb;font-family:inherit;font-size:14px;background:#fafbfc">
        </div>
        <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;color:#0369a1;line-height:1.6">
          💡 فایل در پوشه Downloads ذخیره می‌شود.
        </div>
      </div>
      <button class="btn btn-p" onclick="makePDF()">📥 دانلود PDF</button>
    </div>
  </main>

  <!-- پیش‌نمایش واقعی A4 -->
  <aside class="preview-col" id="previewCol">
    <div class="preview-toolbar">
      <div class="zoom-info">
        <span>🔍 بزرگ‌نمایی</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button onclick="zoom(-1)">−</button>
        <span id="zoomVal" style="min-width:40px;text-align:center">۵۰٪</span>
        <button onclick="zoom(1)">+</button>
        <button onclick="zoomReset()" style="width:auto;padding:0 8px;font-size:11px">ریست</button>
        <button class="preview-close" onclick="toggleMobilePreview(false)">بستن ✕</button>
      </div>
    </div>
    <div class="preview-stage">
      <div class="paper" id="paper">
        <div class="paper-inner" id="paperInner"></div>
      </div>
    </div>
  </aside>

</div>

<!-- دکمه شناور پیش‌نمایش (موبایل) -->
<button class="float-preview" onclick="toggleMobilePreview(true)">👁️</button>

<nav class="tabs">
  <button class="tab active" data-t="text" onclick="tab('text')"><i>✍️</i>متن</button>
  <button class="tab" data-t="set" onclick="tab('set')"><i>⚙️</i>تنظیمات</button>
  <button class="tab" data-t="exp" onclick="tab('exp')"><i>📥</i>خروجی</button>
</nav>

<div class="load" id="load"><div class="box"><div class="spin"></div><p style="font-weight:600;font-size:14px">در حال ساخت...</p></div></div>
<div class="toast" id="toast"></div>
<div id="pdf"></div>

<script>
// اعداد فارسی
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

// تب‌ها
function tab(n){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+n).classList.add('active');
  document.querySelector(`.tab[data-t="${n}"]`).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// اسلایدرها
[['fs','fsV'],['lh','lhV'],['pd','pdV']].forEach(([id,vid])=>{
  const el=document.getElementById(id),v=document.getElementById(vid);
  el.addEventListener('input',()=>{v.textContent=fa(el.value);live()});
  v.textContent=fa(el.value);
});

// چیپ‌ها
['ffG','dirG','alG','psG'].forEach(g=>{
  document.getElementById(g).addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    document.querySelectorAll(`#${g} .chip`).forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    // تغییر اندازه کاغذ
    if(g==='psG') updatePaperSize();
    live();
  });
});
const cv=g=>document.querySelector(`#${g} .chip.active`).dataset.v;

// اندازه کاغذ بر اساس انتخاب
const paperSizes={a4:{w:'210mm',h:'297mm'},a5:{w:'148mm',h:'210mm'},letter:{w:'216mm',h:'279mm'}};
function updatePaperSize(){
  const s=paperSizes[cv('psG')];
  const p=document.getElementById('paper');
  p.style.width=s.w;
  p.style.minHeight=s.h;
}

// شمارش
const txt=document.getElementById('txt');
function counts(){
  const t=txt.value;
  document.getElementById('cc').textContent=fa(t.length)+' کاراکتر';
  document.getElementById('wc').textContent=fa(t.trim()?t.trim().split(/\s+/).length:0)+' کلمه';
}
txt.addEventListener('input',()=>{counts();live()});
counts();

// اعمال استایل به عنصر
function styling(el){
  el.style.fontSize=document.getElementById('fs').value+'px';
  el.style.lineHeight=document.getElementById('lh').value;
  el.style.padding=document.getElementById('pd').value+'px';
  el.style.direction=cv('dirG');
  el.style.textAlign=cv('alG');
  el.style.fontFamily=`'${cv('ffG')}',Tahoma,sans-serif`;
}

// پیش‌نمایش زنده — دقیقاً شبیه PDF
function live(){
  const inner=document.getElementById('paperInner');
  inner.textContent=txt.value;
  styling(inner);
}

// زوم پیش‌نمایش
let currentZoom=50;
function applyZoom(){
  document.getElementById('paper').style.transform=`scale(${currentZoom/100})`;
  document.getElementById('zoomVal').textContent=fa(currentZoom)+'٪';
}
function zoom(d){
  currentZoom=Math.max(20,Math.min(150,currentZoom+d*10));
  applyZoom();
}
function zoomReset(){currentZoom=50;applyZoom()}

// پیش‌نمایش موبایل
function toggleMobilePreview(show){
  document.getElementById('previewCol').classList.toggle('on',show);
}

// توست
let tt;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500);
}

// ساخت PDF
function makePDF(){
  if(!txt.value.trim()){toast('⚠️ متن را وارد کنید');tab('text');return}
  const c=document.getElementById('pdf');
  c.textContent=txt.value;
  styling(c);
  document.getElementById('load').classList.add('on');
  setTimeout(()=>{
    html2pdf().set({
      margin:0,
      filename:(document.getElementById('fn').value.trim()||'document')+'.pdf',
      image:{type:'jpeg',quality:.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff',logging:false},
      jsPDF:{unit:'mm',format:cv('psG'),orientation:'portrait'},
      pagebreak:{mode:['avoid-all','css','legacy']}
    }).from(c).save()
    .then(()=>{document.getElementById('load').classList.remove('on');toast('✅ PDF ساخته شد')})
    .catch(e=>{document.getElementById('load').classList.remove('on');toast('❌ خطا');console.error(e)});
  },80);
}

// جلوگیری از زوم دوبار لمس
let lt=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n},{passive:false});

// شروع
updatePaperSize();
applyZoom();
live();
</script>

</body>
</html>
