<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متن به PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#eef0f5;color:#1f2937;font-size:15px;line-height:1.7;min-height:100vh}

header{position:sticky;top:0;z-index:50;background:#6366f1;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #6366f133}
header h1{font-size:17px;font-weight:700}
header .pages{background:#fff2;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}

main{padding:16px;max-width:800px;margin:0 auto;padding-bottom:100px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000d}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #eef2ff}

textarea{width:100%;min-height:320px;padding:14px;border-radius:12px;border:2px solid #e5e7eb;background:#fafbfc;font-family:inherit;font-size:16px;line-height:1.9;resize:vertical;transition:.2s}
textarea:focus{outline:0;border-color:#6366f1;background:#fff}
textarea::placeholder{color:#b8bcc7}

.info{display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-top:8px;padding:0 4px}

.ctrl{margin-bottom:18px}
.ctrl:last-child{margin-bottom:0}
.ctrl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;font-weight:600}
.ctrl-val{background:#6366f1;color:#fff;padding:2px 12px;border-radius:14px;font-size:12px;font-weight:700;min-width:44px;text-align:center}

input[type=range]{width:100%;height:36px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#e5e7eb}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#6366f1;margin-top:-10px;border:3px solid #fff;box-shadow:0 2px 6px #6366f166}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:65px;padding:11px 6px;border-radius:10px;border:2px solid #e5e7eb;background:#fff;color:#6b7280;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:.15s}
.chip.active{background:#eef2ff;border-color:#6366f1;color:#4f46e5}

.btn{width:100%;padding:15px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn-p{background:#6366f1;color:#fff;box-shadow:0 4px 12px #6366f144}
.btn-s{background:#fff;color:#4b5563;border:2px solid #e5e7eb;margin-top:10px}

.viewer{position:fixed;inset:0;background:#3a3f4b;z-index:200;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer-head{background:#252932;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.viewer-head .title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.viewer-head .count{background:#ffffff1a;padding:4px 10px;border-radius:12px;font-size:12px}
.viewer-head .close{background:#ef4444;border:0;color:#fff;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.viewer-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:20px}

.page-wrap{position:relative;flex-shrink:0}
.page{background:#fff;width:210mm;height:297mm;box-shadow:0 4px 20px #0006;overflow:hidden;position:relative}
.page-content{position:absolute;inset:0;padding:30px;color:#000;white-space:pre-wrap;word-wrap:break-word;overflow:hidden}
.page-num{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);color:#cbd5e1;font-size:12px;font-weight:600;white-space:nowrap}

@media(max-width:900px){
  .page{transform:scale(.42);transform-origin:top center}
  .page-wrap{height:calc(297mm * .42 + 20px)}
  .page-num{bottom:-24px;font-size:14px}
  .viewer-body{padding:14px;gap:0}
}

.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:100}
.tab{flex:1;background:0;border:0;padding:8px 4px;font-family:inherit;font-size:11px;font-weight:600;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px}
.tab i{font-size:20px;font-style:normal}
.tab.active{color:#6366f1;background:#eef2ff}
.panel{display:none}
.panel.active{display:block}

.load{position:fixed;inset:0;background:#00000080;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999}
.load.on{display:flex}
.load-box{background:#fff;padding:24px 32px;border-radius:16px;text-align:center}
.spin{width:42px;height:42px;border:4px solid #eef2ff;border-top-color:#6366f1;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,100px);background:#1f2937;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:.3s;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <h1>📄 متن به PDF</h1>
  <div class="pages" id="pageBadge">۰ صفحه</div>
</header>

<main>
  <div class="panel active" id="p-text">
    <div class="card">
      <h3>✍️ متن</h3>
      <textarea id="txt" placeholder="متن خود را اینجا بنویسید یا پیست کنید..."></textarea>
      <div class="info"><span id="cc">۰ کاراکتر</span><span id="wc">۰ کلمه</span></div>
    </div>
  </div>

  <div class="panel" id="p-set">
    <div class="card">
      <h3>🔤 فونت</h3>
      <div class="ctrl">
        <div class="ctrl-head"><span>سایز فونت</span><span class="ctrl-val" id="fsV">۱۴</span></div>
        <input type="range" id="fs" min="8" max="40" value="14">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><span>فاصله خطوط</span><span class="ctrl-val" id="lhV">۱.۸</span></div>
        <input type="range" id="lh" min="1" max="3" step="0.1" value="1.8">
      </div>
      <div class="ctrl">
        <div class="ctrl-head"><span>حاشیه</span><span class="ctrl-val" id="pdV">۳۰</span></div>
        <input type="range" id="pd" min="10" max="80" value="30">
      </div>
    </div>

    <div class="card">
      <h3>📐 تراز</h3>
      <div class="chips" id="alG">
        <button class="chip active" data-v="right">راست</button>
        <button class="chip" data-v="justify">هم‌تراز</button>
        <button class="chip" data-v="center">وسط</button>
      </div>
    </div>

    <div class="card">
      <h3>📄 اندازه صفحه</h3>
      <div class="chips" id="psG">
        <button class="chip active" data-v="a4">A4</button>
        <button class="chip" data-v="a5">A5</button>
        <button class="chip" data-v="letter">Letter</button>
      </div>
    </div>
  </div>

  <div class="panel" id="p-exp">
    <div class="card">
      <h3>💾 خروجی</h3>
      <div class="ctrl">
        <div class="ctrl-head"><span>نام فایل</span></div>
        <input type="text" id="fn" value="document" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e5e7eb;font-family:inherit;font-size:14px;background:#fafbfc">
      </div>
    </div>
    <button class="btn btn-p" onclick="openViewer()">👁️ پیش‌نمایش</button>
    <button class="btn btn-s" onclick="downloadPDF()">📥 دانلود PDF</button>
  </div>
</main>

<nav class="tabs">
  <button class="tab active" data-t="text" onclick="tab('text')"><i>✍️</i>متن</button>
  <button class="tab" data-t="set" onclick="tab('set')"><i>⚙️</i>تنظیمات</button>
  <button class="tab" data-t="exp" onclick="tab('exp')"><i>📥</i>خروجی</button>
</nav>

<div class="viewer" id="viewer">
  <div class="viewer-head">
    <div class="title">👁️ پیش‌نمایش <span class="count" id="viewerCount">۰ صفحه</span></div>
    <button class="close" onclick="closeViewer()">بستن ✕</button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<div class="load" id="load"><div class="load-box"><div class="spin"></div><p style="font-weight:600;font-size:14px">در حال ساخت...</p></div></div>
<div class="toast" id="toast"></div>

<script>
// ========== ابزار ==========
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const $ = id => document.getElementById(id);
const cv = g => document.querySelector(`#${g} .chip.active`).dataset.v;

// ========== تب‌ها ==========
function tab(name){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  $('p-' + name).classList.add('active');
  document.querySelector(`.tab[data-t="${name}"]`).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ========== تنظیمات ==========
function getSettings(){
  return {
    fontSize: +$('fs').value,
    lineHeight: +$('lh').value,
    padding: +$('pd').value,
    align: cv('alG'),
    size: cv('psG')
  };
}

const PAPER_MM = {
  a4: {w:210, h:297},
  a5: {w:148, h:210},
  letter: {w:216, h:279}
};

// ========== اسلایدرها ==========
[['fs','fsV'],['lh','lhV'],['pd','pdV']].forEach(([id,vid])=>{
  const el = $(id), v = $(vid);
  el.addEventListener('input', ()=>{ v.textContent = fa(el.value); updatePageCount(); });
  v.textContent = fa(el.value);
});

// ========== چیپ‌ها ==========
['alG','psG'].forEach(g=>{
  $(g).addEventListener('click', e=>{
    const c = e.target.closest('.chip');
    if(!c) return;
    $(g).querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    updatePageCount();
  });
});

// ========== شمارش ==========
const txt = $('txt');
function updateCounts(){
  const t = txt.value;
  $('cc').textContent = fa(t.length) + ' کاراکتر';
  $('wc').textContent = fa(t.trim() ? t.trim().split(/\s+/).length : 0) + ' کلمه';
}
txt.addEventListener('input', ()=>{ updateCounts(); updatePageCount(); });
updateCounts();

// ========== شمارش صفحات ==========
function countPages(){
  if(!txt.value.trim()) return 0;
  const s = getSettings();
  const mm = PAPER_MM[s.size];
  const PX_PER_MM = 96/25.4;
  const pageW = mm.w * PX_PER_MM;
  const pageH = mm.h * PX_PER_MM;

  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;left:-99999px;top:0;
    width:${pageW}px;box-sizing:border-box;
    font-size:${s.fontSize}px;line-height:${s.lineHeight};
    padding:${s.padding}px;
    font-family:Vazirmatn,Tahoma,sans-serif;
    direction:rtl;text-align:${s.align};
    white-space:pre-wrap;word-wrap:break-word;`;
  probe.textContent = txt.value;
  document.body.appendChild(probe);

  const innerH = pageH - s.padding*2;
  const totalH = probe.scrollHeight - s.padding*2;
  document.body.removeChild(probe);

  if(totalH <= 0) return 1;
  return Math.max(1, Math.ceil(totalH / innerH));
}

function updatePageCount(){
  const n = countPages();
  $('pageBadge').textContent = fa(n) + ' صفحه';
}

// ========== پیش‌نمایش ==========
function openViewer(){
  if(!txt.value.trim()){ toast('⚠️ ابتدا متن را وارد کنید'); tab('text'); return; }
  buildPreview();
  $('viewer').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeViewer(){
  $('viewer').classList.remove('on');
  document.body.style.overflow = '';
}

function buildPreview(){
  const s = getSettings();
  const mm = PAPER_MM[s.size];
  const PX_PER_MM = 96/25.4;
  const innerH_px = (mm.h - s.padding*2) * PX_PER_MM;

  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;left:-99999px;top:0;
    width:${mm.w}mm;box-sizing:border-box;
    font-size:${s.fontSize}px;line-height:${s.lineHeight};
    padding:${s.padding}px;
    font-family:Vazirmatn,Tahoma,sans-serif;
    direction:rtl;text-align:${s.align};
    white-space:pre-wrap;word-wrap:break-word;`;
  document.body.appendChild(probe);

  function fits(t){
    probe.textContent = t;
    return (probe.scrollHeight - s.padding*2) <= innerH_px;
  }

  const tokens = txt.value.split(/(\s+)/);
  const pages = [];
  let buf = '';

  for(const tok of tokens){
    const test = buf + tok;
    if(fits(test)){ buf = test; }
    else {
      pages.push(buf.replace(/\s+$/,''));
      buf = tok.replace(/^\s+/,'');
      if(!fits(buf)){ pages.push(buf); buf = ''; }
    }
  }
  if(buf.trim() || !pages.length) pages.push(buf);

  document.body.removeChild(probe);

  const body = $('viewerBody');
  body.innerHTML = '';
  pages.forEach((content, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    const page = document.createElement('div');
    page.className = 'page';
    page.style.width = mm.w + 'mm';
    page.style.height = mm.h + 'mm';
    const inner = document.createElement('div');
    inner.className = 'page-content';
    inner.textContent = content;
    inner.style.fontSize = s.fontSize + 'px';
    inner.style.lineHeight = s.lineHeight;
    inner.style.padding = s.padding + 'px';
    inner.style.direction = 'rtl';
    inner.style.textAlign = s.align;
    page.appendChild(inner);
    wrap.appendChild(page);
    const num = document.createElement('div');
    num.className = 'page-num';
    num.textContent = `صفحه ${fa(idx+1)} از ${fa(pages.length)}`;
    wrap.appendChild(num);
    body.appendChild(wrap);
  });

  $('viewerCount').textContent = fa(pages.length) + ' صفحه';
  $('pageBadge').textContent = fa(pages.length) + ' صفحه';
}

// ========== دانلود PDF با canvas (حروف سالم) ==========
async function downloadPDF(){
  if(!txt.value.trim()){ toast('⚠️ ابتدا متن را وارد کنید'); tab('text'); return; }
  $('load').classList.add('on');
  toast('⏳ در حال ساخت PDF...');

  try {
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 300));

    const s = getSettings();
    const mm = PAPER_MM[s.size];
    const pageSize = s.size;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      unit: 'mm',
      format: pageSize,
      orientation: 'portrait',
      compress: true
    });

    const PX_PER_MM = 96 / 25.4;
    const SCALE = 3;
    const pageWidthPx = mm.w * PX_PER_MM * SCALE;
    const pageHeightPx = mm.h * PX_PER_MM * SCALE;

    const pages = splitIntoPages(s, mm.h - s.padding*2, mm.w);

    for(let i = 0; i < pages.length; i++){
      const canvas = document.createElement('canvas');
      canvas.width = pageWidthPx;
      canvas.height = pageHeightPx;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const realFontPx = s.fontSize * SCALE;
      const realLineHeight = s.fontSize * s.lineHeight * SCALE;
      const padPx = s.padding * PX_PER_MM * SCALE;

      ctx.fillStyle = '#000000';
      ctx.direction = 'rtl';
      ctx.textBaseline = 'top';
      ctx.font = `${realFontPx}px Vazirmatn, Tahoma, sans-serif`;

      const maxWidth = canvas.width - padPx * 2;
      const lines = wrapText(ctx, pages[i], maxWidth);

      const startX = s.align === 'right' ? canvas.width - padPx
                   : s.align === 'center' ? canvas.width / 2
                   : padPx;
      let y = padPx;

      ctx.textAlign = s.align === 'center' ? 'center' : (s.align === 'right' ? 'right' : 'left');

      for(const line of lines){
        if(y + realLineHeight > canvas.height - padPx) break;
        ctx.fillText(line, startX, y);
        y += realLineHeight;
      }

      if(i > 0) pdf.addPage();
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(imgData, 'JPEG', 0, 0, mm.w, mm.h, undefined, 'FAST');
    }

    const filename = ($('fn').value.trim() || 'document') + '.pdf';
    pdf.save(filename);

    $('load').classList.remove('on');
    toast('✅ PDF دانلود شد');
  } catch(err){
    console.error(err);
    $('load').classList.remove('on');
    toast('❌ خطا: ' + err.message);
  }
}

// ========== تقسیم متن به صفحات ==========
function splitIntoPages(s, innerH_mm, pageW_mm){
  const PX_PER_MM = 96 / 25.4;
  const pageW = pageW_mm * PX_PER_MM;
  const innerH = innerH_mm * PX_PER_MM;

  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;left:-99999px;top:0;
    width:${pageW}px;box-sizing:border-box;
    font-size:${s.fontSize}px;line-height:${s.lineHeight};
    padding:${s.padding}px;
    font-family:Vazirmatn,Tahoma,sans-serif;
    direction:rtl;text-align:${s.align};
    white-space:pre-wrap;word-wrap:break-word;`;
  document.body.appendChild(probe);

  function fits(t){
    probe.textContent = t;
    return (probe.scrollHeight - s.padding*2) <= innerH;
  }

  const tokens = txt.value.split(/(\s+)/);
  const pages = [];
  let buf = '';

  for(const tok of tokens){
    const test = buf + tok;
    if(fits(test)){ buf = test; }
    else {
      pages.push(buf.replace(/\s+$/,''));
      buf = tok.replace(/^\s+/,'');
      if(!fits(buf)){ pages.push(buf); buf = ''; }
    }
  }
  if(buf.trim() || !pages.length) pages.push(buf);

  document.body.removeChild(probe);
  return pages;
}

// ========== شکست متن برای canvas ==========
function wrapText(ctx, text, maxWidth){
  const lines = [];
  const paragraphs = text.split('\n');

  for(const para of paragraphs){
    if(para === ''){ lines.push(''); continue; }
    const words = para.split(/(\s+)/);
    let currentLine = '';

    for(const word of words){
      const test = currentLine + word;
      const w = ctx.measureText(test).width;
      if(w <= maxWidth){
        currentLine = test;
      } else {
        if(currentLine.trim()) lines.push(currentLine.replace(/\s+$/, ''));
        currentLine = word.replace(/^\s+/, '');
      }
    }
    if(currentLine.trim()) lines.push(currentLine);
    else if(para !== '') lines.push('');
  }

  return lines;
}

// ========== توست ==========
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 3000);
}

updatePageCount();
</script>

</body>
</html>
